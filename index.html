  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fredoka:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --bg2: #f5f5f7;
      --card: rgba(255,255,255,0.82);
      --border: rgba(255,198,41,0.18);
      --teal: #ff4458;
      --coral: #ff7a3d;
      --gold: #ffc629;
      --text: #1d1d1f;
      --muted: #6e6e73;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    h1,h2,h3 { font-family: 'Inter', sans-serif; }

    /* Starfield */
    .stars {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .star {
      position: absolute; background: #d2d2d7; border-radius: 50%;
      animation: twinkle var(--d) ease-in-out infinite;
    }
    @keyframes twinkle {
      0%,100% { opacity: 0.1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.2); }
    }

    /* Glow orbs */
    .orb {
      position: fixed; border-radius: 50%; filter: blur(80px);
      pointer-events: none; z-index: 0; opacity: 0.15;
    }

    /* Glass card */
    .glass {
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(255,198,41,0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #d2d2d7; border-radius: 3px; }

    /* Nav */
    .nav-link {
      position: relative; padding: 6px 4px; font-weight: 500;
      color: var(--muted); transition: color 0.2s; cursor: pointer;
    }
    .nav-link::after {
      content: ''; position: absolute; bottom: -2px; left: 0; right: 0;
      height: 2px; background: var(--teal); transform: scaleX(0);
      transition: transform 0.2s; border-radius: 2px;
    }
    .nav-link.active { color: var(--teal); }
    .nav-link.active::after { transform: scaleX(1); }
    .nav-link:hover { color: var(--text); }

    /* Post card */
    .post-card {
      transition: transform 0.2s, box-shadow 0.2s;
      border-radius: 16px;
      animation: fadeUp 0.4s ease both;
    }
    .post-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(255,68,88,0.13);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Reaction btn */
    .react-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border);
      background: rgba(255,255,255,0.03); cursor: pointer;
      transition: all 0.18s; font-size: 13px; font-weight: 500;
      color: var(--muted);
    }
    .react-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
    .react-btn.active-like { background: rgba(99,179,237,0.15); border-color: #63b3ed; color: #63b3ed; }
    .react-btn.active-haha { background: rgba(255,209,102,0.15); border-color: var(--gold); color: var(--gold); }
    .react-btn.active-heart { background: rgba(255,107,107,0.15); border-color: var(--coral); color: var(--coral); }

    /* Input */
    .inp {
      width: 100%; background: rgba(255,255,255,0.9);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 11px 14px; color: var(--text); font-family: 'Inter', sans-serif;
      font-size: 15px; outline: none; transition: border-color 0.2s;
    }
    .inp:focus { border-color: var(--teal); }
    .inp::placeholder { color: var(--muted); }
    textarea.inp { resize: vertical; min-height: 120px; line-height: 1.6; }

    /* Primary btn */
    .btn-primary {
      background: linear-gradient(135deg, #ff4458 0%, #ff7a3d 100%);
      color: white; font-weight: 700; padding: 11px 24px;
      border-radius: 10px; border: none; cursor: pointer;
      transition: opacity 0.2s, transform 0.1s; font-family: 'Inter', sans-serif;
      font-size: 15px; letter-spacing: 0.02em;
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    /* Modal overlay */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(255,255,255,0.88);
      backdrop-filter: blur(8px); z-index: 100;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }

    /* City badge */
    .city-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(255,68,88,0.08); border: 1px solid rgba(255,68,88,0.2);
      color: var(--teal); padding: 3px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 500;
    }

    /* View badge */
    .view-badge {
      display: inline-flex; align-items: center; gap: 4px;
      color: var(--muted); font-size: 12px;
    }

    /* Admin badge */
    .admin-badge {
      background: linear-gradient(135deg, #7c3aed, #db2777);
      color: white; padding: 2px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.05em;
    }

    /* Hero gradient text */
    .grad-text {
      background: linear-gradient(135deg, #ff4458 0%, #ff7a3d 50%, #ffc629 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Comment */
    .comment-item {
      padding: 10px 14px; border-radius: 10px;
      background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      animation: fadeUp 0.3s ease both;
    }

    /* Pulse dot */
    @keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.4);opacity:0.6} }
    .pulse-dot { animation: pulse 2s infinite; }

    /* Loader */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.8s linear infinite; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 999;
      background: white; border: 1px solid var(--teal);
      color: var(--teal); padding: 12px 20px; border-radius: 12px;
      font-weight: 600; font-size: 14px;
      animation: slideIn 0.3s ease, slideOut 0.3s ease 2.5s both;
      box-shadow: 0 4px 20px rgba(255,68,88,0.15);
    }
    @keyframes slideIn { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }
    @keyframes slideOut { from{transform:translateX(0);opacity:1} to{transform:translateX(100%);opacity:0} }

    .tag-chip {
      display: inline-block; background: rgba(255,255,255,0.05);
      border: 1px solid var(--border); padding: 3px 12px;
      border-radius: 999px; font-size: 12px; color: var(--muted);
      cursor: pointer; transition: all 0.2s;
    }
    .tag-chip:hover { background: rgba(255,68,88,0.08); border-color: rgba(255,68,88,0.3); color: var(--teal); }

    /* Admin panel */
    .admin-row { padding: 14px 16px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); }
    .admin-row + .admin-row { margin-top: 8px; }

    /* Number input */
    input[type=number]::-webkit-inner-spin-button { opacity: 1; }

    /* Avatar picker */
    .avatar-grid { display: grid; grid-template-columns: repeat(10,1fr); gap: 7px; margin: 16px 0; }
    .avatar-option {
      width: 42px; height: 42px; border-radius: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; border: 2px solid transparent;
      transition: all 0.18s; background: rgba(255,255,255,0.6);
    }
    .avatar-option:hover { transform: scale(1.1); border-color: var(--teal); }
    .avatar-option.selected { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(255,68,88,0.2); transform: scale(1.1); }

    /* Logo animation */
    @keyframes dividerPulse {
      0%,100% { opacity:1; transform:scaleY(1); }
      50% { opacity:0.4; transform:scaleY(0.7); }
    }
    @keyframes bFlash {
      0%,100% { color:#ff4458; }
      50% { color:#ff7a3d; }
    }
    @keyframes hFlash {
      0%,100% { color:#1d1d1f; }
      50% { color:#ff4458; }
    }
    .logo-b { animation: bFlash 1.4s ease-in-out infinite; font-family:'Inter',sans-serif; font-weight:900; font-size:17px; }
    .logo-h { animation: hFlash 1.4s ease-in-out infinite 0.7s; font-family:'Inter',sans-serif; font-weight:900; font-size:17px; }
    .logo-divider {
      width:2px; height:22px; background:#ff4458; border-radius:2px;
      animation: dividerPulse 1.4s ease-in-out infinite;
    }

    /* Terms & Conditions Modal */
    .terms-overlay {
      position: fixed; inset: 0; z-index: 9998;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(16px);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .terms-box {
      background: white;
      border: 1.5px solid rgba(255,68,88,0.22);
      border-radius: 22px;
      width: 100%; max-width: 480px;
      box-shadow: 0 8px 60px rgba(255,68,88,0.18);
      overflow: hidden;
      animation: fadeUp 0.5s ease both;
    }
    .terms-header {
      background: linear-gradient(135deg, #ff4458 0%, #ff7a3d 100%);
      padding: 28px 28px 22px;
      text-align: center;
    }
    .terms-body {
      padding: 24px 28px 20px;
      max-height: 280px;
      overflow-y: auto;
      border-bottom: 1px solid rgba(255,68,88,0.12);
    }
    .terms-footer {
      padding: 20px 28px 24px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .btn-agree {
      background: linear-gradient(135deg, #ff4458 0%, #ff7a3d 100%);
      color: white; font-weight: 800; padding: 13px 24px;
      border-radius: 11px; border: none; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 15px;
      letter-spacing: 0.02em; transition: opacity 0.2s, transform 0.1s;
      width: 100%;
    }
    .btn-agree:hover { opacity: 0.9; transform: translateY(-1px); }

    /* Hover menu */
    .hover-menu {
      position: absolute; right: 0; top: 100%; margin-top: 6px;
      background: white; border: 1px solid var(--border);
      border-radius: 12px; padding: 6px; min-width: 160px;
      box-shadow: 0 8px 30px rgba(255,68,88,0.12); z-index: 50;
    }
    .hover-menu-item {
      padding: 8px 12px; border-radius: 8px; cursor: pointer;
      font-size: 13px; color: var(--muted); transition: all 0.15s;
      display: flex; align-items: center; gap: 8px;
    }
    .hover-menu-item:hover { background: rgba(255,255,255,0.06); color: var(--text); }
    .hover-menu-item.danger:hover { background: rgba(255,107,107,0.1); color: var(--coral); }

    /* ── Notification Bell ── */
    .notif-wrap { position:relative; }
    .notif-btn {
      background:none; border:none; cursor:pointer;
      width:36px; height:36px; border-radius:10px;
      display:flex; align-items:center; justify-content:center;
      transition:background 0.2s; font-size:19px; color:var(--muted);
    }
    .notif-btn:hover { background:rgba(255,68,88,0.09); color:var(--text); }
    .notif-badge {
      position:absolute; top:-3px; right:-3px;
      min-width:17px; height:17px;
      background:#ef4444; color:white; border-radius:9px;
      font-size:10px; font-weight:800;
      display:flex; align-items:center; justify-content:center;
      padding:0 3px; border:2px solid var(--bg);
      font-family:'Inter',sans-serif; pointer-events:none;
      animation: badgePop 0.3s cubic-bezier(0.175,0.885,0.32,1.6) both;
    }
    @keyframes badgePop { from{transform:scale(0)} to{transform:scale(1)} }

    /* ── Notification Panel ── */
    .notif-panel {
      position:absolute; right:0; top:calc(100% + 10px);
      width:310px; max-height:400px; overflow-y:auto;
      background:white; border:1px solid var(--border);
      border-radius:18px;
      box-shadow:0 12px 48px rgba(255,68,88,0.16);
      z-index:300; animation:fadeUp 0.2s ease;
    }
    .notif-row {
      padding:12px 16px; border-bottom:1px solid rgba(255,198,41,0.1);
      cursor:pointer; transition:background 0.15s;
      display:flex; gap:10px; align-items:flex-start;
    }
    .notif-row:hover { background:rgba(255,68,88,0.04); }
    .notif-row.unread { background:rgba(255,68,88,0.07); border-left:3px solid var(--teal); }
    .notif-row:last-child { border-bottom:none; }

    /* ── Permission Banner ── */
    @keyframes slideUpBanner { from{transform:translateY(100%);opacity:0} to{transform:translateY(0);opacity:1} }
    .perm-banner {
      position:fixed; bottom:0; left:0; right:0; z-index:500;
      background:white; border-top:1.5px solid rgba(255,68,88,0.2);
      padding:14px 24px;
      display:flex; align-items:center; justify-content:space-between; gap:14px;
      box-shadow:0 -4px 28px rgba(255,68,88,0.12);
      animation:slideUpBanner 0.35s ease; flex-wrap:wrap;
    }
    /* Name color tag */
    .name-tag {
      display: inline-flex; align-items: center;
      padding: 2px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 800; color: white; letter-spacing: 0.03em;
    }
    .emoji-strip::-webkit-scrollbar { display: none; }
  </style>
  <style>
:root{--bg:#fff;--bg2:#f5f5f7;--surface:#fff;--text:#1d1d1f;--muted:#6e6e73;--border:rgba(0,0,0,.08);--flame:#ff4458;--flame2:#ff7a3d;--sun:#ffc629;--teal:#ff4458;--coral:#ff7a3d;--gold:#ffc629;--grad:linear-gradient(135deg,#fd267a,#ff6036);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--f:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",Roboto,sans-serif}
html{background:#fff;color-scheme:light;-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--f);min-height:100dvh;touch-action:manipulation;-webkit-font-smoothing:antialiased}
[style*="Inter"]{font-family:var(--f)!important}
h1,h2,h3{font-family:var(--f);font-weight:800;letter-spacing:-.035em}
#root>div{min-height:100dvh!important;background:var(--bg)!important}
:focus-visible{outline:3px solid rgba(255,68,88,.35);outline-offset:2px;border-radius:10px}
::selection{background:var(--sun)}
.boot{position:fixed;inset:0;display:grid;place-items:center;background:transparent;z-index:9999}
.boot-ring{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,68,88,.15);border-top-color:var(--flame);animation:spin .7s linear infinite}
/* top bar */

.terms-header{background:var(--grad)!important}.terms-header *{color:#fff!important}

.card.c3{transform:translateY(22px) scale(.88);background:#ffe9a8}.card.c2{transform:translateY(11px) scale(.94) rotate(3deg);background:#ffd1d9}
.card.c1{background:linear-gradient(160deg,#ffc629 0%,#ff7a3d 55%,#fd267a 130%);transform:rotate(-2deg);display:flex;flex-direction:column;justify-content:flex-end;padding:26px;color:#fff}
.card .tag{position:absolute;top:22px;left:22px;background:rgba(255,255,255,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700}
.card q{quotes:none;font-size:clamp(24px,2.7vw,31px);line-height:1.12;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.card small{opacity:.9;font-weight:600}
.acts{position:absolute;left:0;right:0;bottom:-34px;display:flex;justify-content:center;gap:18px;z-index:2}
.acts b{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 8px 24px rgba(0,0,0,.16)}.acts b:first-child{color:#8e8e93}.acts b:last-child{color:var(--flame)}.acts b:nth-child(2){width:46px;height:46px;margin-top:6px;font-size:18px;color:#ffc629}
.hero-copy>*{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}.hero-copy>:nth-child(2){animation-delay:.07s}.hero-copy>:nth-child(3){animation-delay:.14s}.hero-copy>:nth-child(4){animation-delay:.21s}.deck{animation:pop .8s .15s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.96)}}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg2);border-radius:28px;margin:54px 0 48px;text-align:center}
.stat-row>div{padding:24px 6px}.stat-row>div+div{border-left:1px solid var(--border)}.stat-row b{display:block;font-size:clamp(24px,3.4vw,38px);font-weight:800;letter-spacing:-.04em}.stat-row span{font-size:13px;font-weight:600;color:var(--muted)}

.quote{font-size:clamp(28px,4.6vw,56px);line-height:1.05;font-weight:800;letter-spacing:-.045em;max-width:15em;margin-bottom:18px}.sec p.sub{color:var(--muted);font-size:18px;line-height:1.55;max-width:32em}

.foot{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:space-between;padding:22px 0 calc(24px + var(--sab));font-size:13px;color:var(--muted)}

@media(max-width:820px){
.hero{grid-template-columns:1fr;gap:56px;min-height:0;padding:22px 0 40px}.hero-h{font-size:clamp(36px,10.5vw,76px);margin-bottom:18px}.hero-p{font-size:17px;margin-bottom:26px}.micro{text-align:center}.deck{width:min(86%,320px)}
.topnav>div{height:auto!important;flex-wrap:nowrap;padding:8px 0}
.topnav{margin-bottom:60px}
.topnav{position:relative!important}
.navlinks{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin:10px 0 0!important;width:auto;display:flex;background:rgba(120,120,128,.12)!important;padding:3px!important}
.navlinks .nav-link{padding:7px 18px;font-size:14px}.status{font-size:11px;padding:6px 9px;margin-right:6px;gap:5px;white-space:nowrap}

.page{padding:0 18px calc(32px + var(--sab))!important}
.cta{width:100%}.final .cta{width:auto}.stat-row{margin:40px 0 28px;border-radius:24px}
.notif-panel{position:fixed;left:12px;right:12px;width:auto;top:calc(60px + var(--sat))}
.avatar-grid{grid-template-columns:repeat(5,1fr)}.avatar-option{width:100%;height:46px}.terms-body{max-height:34dvh}

button[aria-label="Close"]{min-width:44px;min-height:44px;display:inline-grid;place-items:center}

/* chat */

.cm-rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.cm-rx button,.cm-pick button{border:0;background:#fff;border-radius:999px;padding:3px 9px;font-size:13px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1);min-height:28px}.cm-rx .on{background:rgba(255,68,88,.14);box-shadow:inset 0 0 0 1.5px var(--flame)}
.cm-acts{display:flex;gap:2px;margin-top:2px;opacity:.6}.cm-acts button{background:none;border:0;font:600 12px var(--f);color:var(--muted);padding:5px 7px;cursor:pointer}
.cm-pick{display:flex;gap:4px;background:#fff;border-radius:999px;padding:4px;box-shadow:0 6px 24px rgba(0,0,0,.18);margin-top:4px;align-self:flex-start}.cm-pick button{font-size:20px;padding:4px 8px;box-shadow:none}
.chat-rp{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border-left:4px solid var(--sun);border-radius:12px;padding:6px 6px 6px 12px;margin-top:8px;font-size:13px;color:var(--muted)}.chat-rp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-in{display:flex;gap:8px;align-items:flex-end;margin-top:8px}.chat-in .inp{flex:1;min-height:48px;max-height:130px;resize:none;border-radius:24px;padding:12px 16px}.chat-in .cta{width:48px;height:48px;padding:0;font-size:22px;flex:none}.cta:disabled{opacity:.45;cursor:default}
.chat-setup{padding:20px 0}.chat-setup h2{font-size:clamp(28px,5vw,40px);margin-bottom:8px}.chat-setup .sub{color:var(--muted);margin-bottom:22px}.lbl{display:block;font-size:13px;font-weight:700;margin:16px 0 8px}
.chat-emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-bottom:12px;max-height:290px;overflow-y:auto;overscroll-behavior:contain;padding:4px;background:var(--bg2);border-radius:18px}.chat-emo button{height:48px;font-size:24px;border:0;border-radius:14px;background:var(--bg2);cursor:pointer}.chat-emo .on{box-shadow:0 0 0 3px var(--flame);background:#fff}
@media(max-width:820px){.chat{height:calc(100dvh - 140px - var(--sat))}.cm{max-width:94%}.chat-top h2{font-size:21px}}
.emo-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.emo-tabs::-webkit-scrollbar{display:none}.emo-tabs button{flex:none;border:0;background:var(--bg2);border-radius:999px;padding:8px 16px;font:600 14px var(--f);color:var(--muted);cursor:pointer}.emo-tabs .on{background:var(--text);color:#fff}

.nav-link{position:relative}a.nav-link{text-decoration:none}

.chat-team{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;color:var(--muted);margin-top:8px}.chat-team input{width:18px;height:18px;accent-color:#7c3aed}
